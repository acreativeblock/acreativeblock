<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Creative Block — Logo Lab (4-up)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23212324'/%3E%3C/svg%3E">
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font)}
.hint{position:fixed;left:0;right:0;top:14px;text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#fff;mix-blend-mode:difference;z-index:5}
.grid{position:sticky;top:0;height:100vh;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative;overflow:hidden}
.cell.light{background:#FAFAFA;color:#212324}
.cell.dark{background:#212324;color:#FAFAFA}
.cell{border:.5px solid rgba(128,128,128,.4)}
.tag{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;opacity:.5}
.runway{height:260vh}
.foot{position:fixed;left:0;right:0;bottom:12px;text-align:center;font-size:11px;color:#fff;mix-blend-mode:difference;z-index:5}
</style>
</head>
<body>

<div class="hint">Scroll = gravity (top row) · move cursor = eye follows &amp; blinks (bottom row)</div>

<div class="grid">
  <div class="cell light">
    <span class="tag">1 line · gravity</span>
    <span class="acb-logo-mount" data-acb-logo="1line" style="display:inline-block;height:min(6vh,44px);color:#212324"></span>
  </div>
  <div class="cell dark">
    <span class="tag">3 lines · gravity</span>
    <span class="acb-logo-mount" data-acb-logo="3lines" style="display:inline-block;height:min(26vh,200px);color:#FAFAFA"></span>
  </div>
  <div class="cell dark">
    <span class="tag">1 line · blinking eye</span>
    <span class="acb-logo-mount" data-acb-logo="1line" data-acb-mode="eye" style="display:inline-block;height:min(6vh,44px);color:#FAFAFA"></span>
  </div>
  <div class="cell light">
    <span class="tag">3 lines · blinking eye</span>
    <span class="acb-logo-mount" data-acb-logo="3lines" data-acb-mode="eye" style="display:inline-block;height:min(26vh,200px);color:#212324"></span>
  </div>
</div>
<div class="runway"></div>
<div class="foot">Top row: scroll to crash · hover to whack &nbsp;|&nbsp; Bottom row: the O is an eye — pupil follows your cursor, blinks on its own</div>

<script src="../_logo/logo-anim.js"></script>
</body>
</html>
