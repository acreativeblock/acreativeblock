<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">

<title>A Creative Block — Logo Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23212324'/%3E%3C/svg%3E">
<style>
:root{--bg:#FAFAFA;--ink:#212324;--muted:#8a8d8e;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
.hint{position:fixed;left:0;right:0;top:18px;text-align:center;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);z-index:5}
/* sticky stage keeps the logo on screen while you scroll */
.stage{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center}
.logowrap{width:min(88vw,1000px)}
svg{width:100%;height:auto;display:block;overflow:visible;visibility:hidden}
/* scroll runway so there IS something to scroll */
.runway{height:320vh}
.foot{position:fixed;left:0;right:0;bottom:16px;text-align:center;font-size:12px;color:var(--muted);z-index:5}
.foot b{color:var(--ink)}
</style>
</head>
<body>

<div class="hint">Scroll to shake the blocks</div>

<path d="M1716.91 12.4545C1735.18 11.8152 1750.77 16.6025 1761.95 25.6336C1773.14 34.6753 1779.84 47.9139 1780.4 64C1781.15 85.5894 1766.62 106.369 1746.98 111.851C1760.59 113.553 1771.99 119.059 1780.24 127.514C1788.94 136.443 1794.06 148.602 1794.56 162.882C1795.22 181.731 1788.98 197.089 1776.81 207.916C1764.66 218.721 1746.7 224.919 1724.08 225.711L1643.3 228.538L1635.83 15.2919L1716.91 12.4545ZM1670.76 202.271L1719.24 200.574C1735.02 200.022 1746.77 196.405 1754.45 190.041C1762.09 183.713 1765.85 174.557 1765.43 162.582C1765.01 150.622 1760.49 141.873 1752.06 136.213C1743.57 130.513 1730.97 127.852 1714.23 128.438L1668.24 130.047L1670.76 202.271ZM1667.37 105.357L1705.9 104.009C1721.38 103.467 1733.07 99.9616 1740.77 93.8945C1748.43 87.8645 1752.25 79.2166 1751.86 68.0767C1751.51 57.856 1747.74 50.1606 1741.04 45.1023C1734.31 40.0188 1724.47 37.4965 1711.79 37.9401L1665.07 39.5753L1667.37 105.357Z" fill="black" stroke="black" stroke-width="2"/>
<circle id="dot" cx="1984.51" cy="169.847" r="27" fill="black"/>
    </svg>
  </div>
</div>
<div class="runway"></div>
<div class="foot">Physics demo · <b>BLOCK</b> letters fall in on load, bounce on scroll · the dot lives inside the O</div>

<script>
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;

  // ---- tunables ----
  var SPRING=0.019;     // pull back toward home
  var FRICTION=0.94;    // velocity damping (higher = calmer, settles sooner)
  var WALL_E=0.5;       // bounce off walls
  var COLL_E=0.45;      // bounce off other letters
  var GRAV=0.35;        // gravity strength during a "burst"
  var ROT_K=0.24;       // tilt from horizontal motion
  var ROT_SPRING=0.019; // rotation springs back to the crooked home
  var ROT_FRIC=0.91;    // angular damping
  var ROT_IMP=0.04;     // spin imparted when letters collide
  var MAXV=13;          // clamp speed so nothing goes wild
  var POKE_R=64;        // how far the mouse poke reaches past a letter
  var POKE=1.9;         // mouse poke strength
  var THRESH_X=1680;    // paths with centre-x beyond this are the BLOCK letters

  var svg=document.getElementById('logo');
  var dotEl=document.getElementById('dot');
  var paths=[].slice.call(svg.querySelectorAll('path'));

  function boot(){
    // classify BLOCK letters via geometry bbox
    var blocks=[], minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    paths.forEach(function(p){
      var b=p.getBBox(); var cx=b.x+b.width/2;
      if(cx>THRESH_X){
        var body={el:p, cx0:cx, cy0:b.y+b.height/2, w:b.width, h:b.height,
          r:Math.max(18,0.42*Math.min(b.width,b.height)),
          ox:0,oy:0,vx:0,vy:0,rot:0,va:0, released:false, releaseAt:0};
        blocks.push(body);
        if(b.x<minX)minX=b.x; if(b.x+b.width>maxX)maxX=b.x+b.width;
        if(b.y<minY)minY=b.y; if(b.y+b.height>maxY)maxY=b.y+b.height;
      }
    });

    // the O = the block whose bbox contains the dot's centre
    var dcx=+dotEl.getAttribute('cx'), dcy=+dotEl.getAttribute('cy'), dr=+dotEl.getAttribute('r');
    var O=null;
    blocks.forEach(function(bd){
      if(Math.abs(dcx-bd.cx0)<bd.w/2 && Math.abs(dcy-bd.cy0)<bd.h/2){ O=bd; }
    });
    // dot as a body confined inside the O
    var dot={C0x:(O?O.cx0:dcx), C0y:(O?O.cy0:dcy),
      R:Math.max(6, (O?0.30*Math.min(O.w,O.h):40) - dr),
      px:dcx-(O?O.cx0:dcx), py:dcy-(O?O.cy0:dcy), vx:0, vy:0};

    // limited play space (a bit roomier than the letters at rest)
    var wall={l:minX-14, r:Math.min(2501,maxX+14), t:0, b:maxY+18};

    if(reduce){ // no motion: just show the logo at home
      svg.style.visibility='visible'; return;
    }

    // start each letter above its home, released in a quick stagger -> "falls into place"
    blocks.forEach(function(bd,i){
      bd.oy = -(bd.cy0 + bd.h/2 + 30) - i*20; // staggered start heights -> natural cascade
      bd.ox = (Math.random()-0.5)*30;
      bd.vy = 5;                              // already moving: no static sit at the top
      bd.released = true;
      bd.el.setAttribute('transform','translate('+bd.ox+' '+bd.oy+')'); // position BEFORE reveal
    });
    svg.style.visibility='visible';            // reveal only once positioned — no home-flash
    var gravityUntil = performance.now() + 1600; // gravity burst for the fall-in

    // scroll shakes them
    var lastY = window.pageYOffset;
    function onScroll(){
      var y=window.pageYOffset, d=y-lastY; lastY=y;
      var s=Math.min(Math.abs(d)*0.4, 8);
      if(s<0.6) return;
      gravityUntil = performance.now() + 600;    // brief gentle arc
      blocks.forEach(function(bd){
        bd.vx += (Math.random()-0.5)*s*0.55;
        bd.vy += (d>0? -0.3:0.3)*s + (Math.random()-0.5)*s*0.35; // gentle kick
        bd.va += (Math.random()-0.5)*s*0.24;                     // spin
      });
      dot.vx += (Math.random()-0.5)*s*0.45;
      dot.vy += (d>0?-0.3:0.3)*s*0.5 + (Math.random()-0.5)*s*0.35;
    }
    window.addEventListener('scroll', onScroll, {passive:true});

    // mouse poke: nudge letters (and the dot) away from the cursor
    function onPoke(e){
      var rect=svg.getBoundingClientRect();
      var mx=(e.clientX-rect.left)/rect.width*2501, my=(e.clientY-rect.top)/rect.height*328;
      blocks.forEach(function(bd){
        if(!bd.released) return;
        var dx=(bd.cx0+bd.ox)-mx, dy=(bd.cy0+bd.oy)-my, dist=Math.hypot(dx,dy)||0.001, reach=bd.r+POKE_R;
        if(dist<reach){ var f=(1-dist/reach)*POKE; bd.vx+=(dx/dist)*f; bd.vy+=(dy/dist)*f; bd.va+=(Math.random()-0.5)*f*0.9; gravityUntil=performance.now()+450; }
      });
      var Ox=(O?O.cx0+O.ox:dot.C0x), Oy=(O?O.cy0+O.oy:dot.C0y);
      var ex=(Ox+dot.px)-mx, ey=(Oy+dot.py)-my, ed=Math.hypot(ex,ey)||0.001, er=dot.R+POKE_R;
      if(ed<er){ var g=(1-ed/er)*POKE; dot.vx+=(ex/ed)*g; dot.vy+=(ey/ed)*g; }
    }
    svg.addEventListener('pointermove', onPoke, {passive:true});

    function collide(a,b){
      var dx=(b.cx0+b.ox)-(a.cx0+a.ox), dy=(b.cy0+b.oy)-(a.cy0+a.oy);
      var dist=Math.hypot(dx,dy)||0.001, min=a.r+b.r;
      if(dist<min){
        var nx=dx/dist, ny=dy/dist, overlap=(min-dist);
        a.ox-=nx*overlap/2; a.oy-=ny*overlap/2;
        b.ox+=nx*overlap/2; b.oy+=ny*overlap/2;
        // exchange velocity along the normal
        var avn=a.vx*nx+a.vy*ny, bvn=b.vx*nx+b.vy*ny;
        var m=(avn-bvn)*COLL_E;
        if(avn-bvn>0){
          a.vx-=nx*m; a.vy-=ny*m; b.vx+=nx*m; b.vy+=ny*m;
        }
        // spin from the glancing (tangential) part of the hit
        var tx=-ny, ty=nx, vt=(a.vx-b.vx)*tx+(a.vy-b.vy)*ty;
        a.va += vt*ROT_IMP; b.va -= vt*ROT_IMP;
      }
    }

    function frame(now){
      var gOn = now < gravityUntil;
      // integrate letters
      blocks.forEach(function(bd){
        if(!bd.released){ if(now>=bd.releaseAt) bd.released=true; else { bd.el.setAttribute('transform','translate('+bd.ox+' '+bd.oy+')'); return; } }
        // forces
        bd.vx += -SPRING*bd.ox;
        bd.vy += -SPRING*bd.oy + (gOn?GRAV:0);
        bd.vx *= FRICTION; bd.vy *= FRICTION;
        if(bd.vx>MAXV)bd.vx=MAXV; else if(bd.vx<-MAXV)bd.vx=-MAXV;
        if(bd.vy>MAXV)bd.vy=MAXV; else if(bd.vy<-MAXV)bd.vy=-MAXV;
        bd.ox += bd.vx; bd.oy += bd.vy;
        // walls (limited space)
        var cx=bd.cx0+bd.ox, cy=bd.cy0+bd.oy;
        if(cx-bd.r<wall.l){ bd.ox+=(wall.l-(cx-bd.r)); bd.vx=-bd.vx*WALL_E; }
        if(cx+bd.r>wall.r){ bd.ox-=((cx+bd.r)-wall.r); bd.vx=-bd.vx*WALL_E; }
        if(cy-bd.r<wall.t){ bd.oy+=(wall.t-(cy-bd.r)); bd.vy=-bd.vy*WALL_E; }
        if(cy+bd.r>wall.b){ bd.oy-=((cy+bd.r)-wall.b); bd.vy=-bd.vy*WALL_E; }
        // angular motion: tilt from movement + spin from hits, always springs back to crooked home
        bd.va += bd.vx*ROT_K*0.03;
        bd.va += -ROT_SPRING*bd.rot;
        bd.va *= ROT_FRIC;
        bd.rot += bd.va;
        if(bd.rot>32)bd.rot=32; else if(bd.rot<-32)bd.rot=-32;
      });
      // letter-letter collisions
      for(var i=0;i<blocks.length;i++) for(var j=i+1;j<blocks.length;j++) collide(blocks[i],blocks[j]);
      // apply transforms
      blocks.forEach(function(bd){
        bd.el.setAttribute('transform','translate('+bd.ox.toFixed(2)+' '+bd.oy.toFixed(2)+') rotate('+bd.rot.toFixed(2)+' '+bd.cx0+' '+bd.cy0+')');
      });
      // dot bounces inside the O (follows the O's motion + its own little orbit)
      dot.vx += -0.02*dot.px; dot.vy += -0.02*dot.py + (gOn?GRAV*0.7:0);
      dot.vx*=FRICTION; dot.vy*=FRICTION;
      var dm=MAXV*0.9; if(dot.vx>dm)dot.vx=dm; else if(dot.vx<-dm)dot.vx=-dm; if(dot.vy>dm)dot.vy=dm; else if(dot.vy<-dm)dot.vy=-dm;
      dot.px += dot.vx; dot.py += dot.vy;
      var pd=Math.hypot(dot.px,dot.py);
      if(pd>dot.R){ // reflect off the inner wall of the O
        var nx=dot.px/pd, ny=dot.py/pd;
        dot.px=nx*dot.R; dot.py=ny*dot.R;
        var vn=dot.vx*nx+dot.vy*ny; dot.vx-=(1+WALL_E)*vn*nx; dot.vy-=(1+WALL_E)*vn*ny;
      }
      var Oox=O?O.ox:0, Ooy=O?O.oy:0;
      var tx=(dot.C0x+Oox+dot.px)-dcx, ty=(dot.C0y+Ooy+dot.py)-dcy;
      dotEl.setAttribute('transform','translate('+tx.toFixed(2)+' '+ty.toFixed(2)+')');

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // run as early as the inline SVG is laid out (kills the launch flash)
  if(document.readyState!=='loading') requestAnimationFrame(boot);
  else document.addEventListener('DOMContentLoaded', function(){ requestAnimationFrame(boot); });
})();
</script>
</body>
</html>
