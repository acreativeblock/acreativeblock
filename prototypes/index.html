<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Creative Block — Website versions</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233b39e0'/%3E%3Cpath d='M16 5 L19 13 L27 16 L19 19 L16 27 L13 19 L5 16 L13 13 Z' fill='%23e7f6a0'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f0e6;--ink:#171615;--muted:#6f6a60;--blue:#3b39e0;--red:#fa4616;--line:rgba(23,22,21,.12);--paper:#fffdf7;--shadow:0 14px 40px rgba(23,22,21,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1480px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(16px,3vw,40px)}
header.top{margin-bottom:clamp(28px,4vw,48px)}
.kick{font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:12px}
h1{font-weight:900;letter-spacing:-.04em;line-height:.9;font-size:clamp(40px,8vw,104px)}
.sub{font-size:clamp(16px,1.6vw,20px);font-weight:500;color:#3a372f;max-width:680px;margin-top:18px}
.count{margin-top:18px;font-size:14px;font-weight:700;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(12px,1.2vw,20px)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-5px);box-shadow:0 22px 56px rgba(23,22,21,.18)}
.card.is-fav{border-color:#ff7d92;box-shadow:0 14px 40px rgba(255,59,92,.18)}
.thumb{position:relative;width:100%;aspect-ratio:1280/860;overflow:hidden;background:#e9e4d8;border-bottom:1px solid var(--line)}
.thumb iframe{position:absolute;top:0;left:0;width:1280px;height:860px;border:0;transform-origin:top left;pointer-events:none;background:#fff}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:var(--muted);font-size:14px;text-align:center;padding:20px}
.thumb .vtag{position:absolute;top:12px;left:12px;background:var(--ink);color:#fff;font-weight:900;font-size:13px;letter-spacing:.5px;padding:6px 12px;border-radius:30px;z-index:2}
.thumb .favflag{position:absolute;top:12px;right:12px;z-index:2;width:30px;height:30px;border-radius:50%;background:#fff;display:none;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.card.is-fav .thumb .favflag{display:grid}
.thumb .favflag svg{width:16px;height:16px;fill:#ff3b5c}
.thumb a.full{position:absolute;inset:0;z-index:3}
.meta{padding:11px 13px 12px;display:flex;flex-direction:column;gap:9px;flex:1}
.meta h3{font-weight:700;font-size:12.5px;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .date{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;margin-right:auto}
.meta p{font-size:14px;font-weight:500;color:#3a372f;line-height:1.45}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.badge{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:30px;background:#eceaff;color:var(--blue)}
.badge.site{background:#ffe7df;color:var(--red)}
.actions{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:7px}
a{text-decoration:none;color:inherit}
.open{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:10px 18px;border-radius:30px;transition:transform .15s;margin-right:auto}
.open:hover{transform:translateY(-2px)}
.iconbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;flex-shrink:0;color:var(--muted)}
.iconbtn:hover{border-color:var(--ink);transform:translateY(-2px);color:var(--ink)}
.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fav.on{background:#ffe1e6;border-color:#ff6b81;color:#ff3b5c}
.fav.on svg{fill:#ff3b5c;stroke:#ff3b5c}
.archsec{margin-top:clamp(40px,6vw,72px)}
.archhead{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;border-top:2px solid var(--line);padding-top:22px}
.archhead h2{font-weight:900;font-size:22px;letter-spacing:-.02em}
.archhead .chev{margin-left:auto;font-size:14px;font-weight:800;color:var(--muted)}
.archsec.collapsed #archGrid{display:none}
#archGrid{margin-top:22px;opacity:.85}
.archsec.collapsed .archhead .chev:after{content:"Show"}
.archsec:not(.collapsed) .archhead .chev:after{content:"Hide"}
footer{margin-top:40px;font-size:13px;color:var(--muted);font-weight:600;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kick">A Creative Block</div>
    <h1>Website versions</h1>
    <p class="sub">Every design direction we've built. Each card is a live preview of its home page — click to open the full version, heart your favorites, or archive the ones you're done with.</p>
    <div class="count" id="count"></div>
  </header>
  <div class="grid" id="grid"></div>

  <section class="archsec collapsed" id="archsec" style="display:none">
    <div class="archhead" id="archHead"><h2>Archived</h2><span class="chev" id="chev"></span></div>
    <div class="grid" id="archGrid"></div>
  </section>

  <footer id="foot"></footer>
</div>

  {v:"47",   tag:"Mucho · red + blue boxes", date:"2026-08-06", site:true, home:"v47-mucho/index.html",  desc:"A Mucho-inspired take: black/white and a coral red #EB4B34 across the whole page in Space Grotesk, with pill-shaped outlined buttons and hairline black dividers. A red hero block split into three columns by thin black rules (statement · 'Let's talk about your block' · CTA), a big red-accented method statement, then the six blocks and an Insights row rendered as thick-bordered electric-blue #2B4EF6 press-clipping boxes (Helvetica, one black card for emphasis). Mucho-style footer with FOLLOW / SUBSCRIBE pills, socials, locations, language pills and a floating cookies card."},
  {v:"46",   tag:"Convent · It's Nice That", date:"2026-07-14", site:true, home:"v46-nicethat/index.html",  desc:"The v45 Convent layout re-skinned in an It's Nice That palette: a soft lavender-white #FBF8FF ground with warm near-black #34302E text and lines, a periwinkle-purple #937BF0 accent (block numbers, panel) and a full purple footer echoing their banner. Same ITC Garamond serif + Founders Grotesk, animated grain, staggered reveal and self-hosted fonts."},
  {v:"45",   tag:"Convent",                date:"2026-07-14", site:true, home:"v45-convent/index.html",   desc:"Faithful to Abbotsford Convent: their actual self-hosted fonts (Untitled Serif for big editorial headings, Founders Grotesk for body/UI), a warm off-white #FBFAF7 ground, near-black #17181A ink and very large type. Overlay two-row menu, an italic-serif hero, bright full-bleed accent bands (coral #F26B7B, yellow #FDD53C, teal #3EB8AE), the six blocks as a bordered what's-on tile grid, a serif method list, and a big dark footer with acknowledgement-style statement, newsletter, hours and columns."},

  {v:"43",   tag:"Tally",                  date:"2026-07-14", site:true, home:"v43-tally/index.html",       desc:"A faithful take on Tally.so's design: Inter throughout, a tight 976px centred column on near-white #FEFEFE, big black headings with -0.045em tracking, a single blue #0070D7 accent and small 8px radii. Signature floating face illustrations (recreated as original SVGs) flank a centred hero, a browser-framed one-question mock stands in for the 'form', then clean three-up feature/method rows, a six-blocks grid, a blue sliding-scale callout and a minimal footer."},
  {v:"42",   tag:"Hello · indigo",         date:"2026-07-13", site:true, home:"v42-indigo/index.html",     desc:"The v40 'Hello' card system re-skinned in Inter on a soft off-white #FAF9F6 ground with white surfaces and cool grey borders. A refined palette led by indigo #4F46E5 (highlighted words, numbers, buttons), coral #F9735B period accents and sage #8CBF9F secondary cards — same rounded header card, live Lisbon clock, tall numbered blocks, method list and dark footer as v40, but calmer and more contemporary."},
  {v:"41",   tag:"MindMarket kit",         date:"2026-07-13", site:true, home:"v41-mindmarket/index.html", desc:"A MindMarket-style kit in the Cy Grotesk typeface: a white pill menu on a beige ground, a bright-green rounded hero ('Real human support'), beige stat sections with tilted rounded number cards (white/green/yellow) and hand-wavy underline accents, the six blocks and method as colour cards, and a big yellow 'Let's Connect' footer with a green wavy underline, link columns and locations."},
  {v:"40",   tag:"Hello · vertical cards", date:"2026-07-11", site:true, home:"v40-hello/index.html",       desc:"Carl Hauser's card system taken vertical and big, in the Raw Materials 'Hello' vibe: a cream #f4e9e1 ground, near-black type and a single orange #ff3d00 accent. A rounded header card with a plus-menu and live Lisbon clock, two large numbered statements (01 The belief / 02 The approach), the six blocks as tall portrait cards with date/ID metadata (two inverted to black), a calm method list and an oversized CTA — mostly minimal."},
  {v:"39",   tag:"Raw Materials palette",  date:"2026-07-11", site:true, home:"v39-follow/index.html",     desc:"A copy of v17 recoloured with the real therawmaterials.com palette — cream base, near-black ink, and vivid yellow #ffff00, red #ff003d, blue #2835f8, orange #ff3d00, green #05ff00 and pink #fa89a8 accents. Over a #f9f2e9 ground sits a noise texture using their exact recipe (color-burn blend, cover)."},
  {v:"38",   tag:"Mind Room mega-menu",   date:"2026-07-11", site:true, home:"v38-megamenu/index.html",   desc:"The Mind Room-style header: few top-level items (About, What We Do, Library, Book a call, search) with a full-width mega-menu that drops down on hover — columns for how we help, the six blocks, learn, and a featured panel — plus a circular cyan badge logo. Clean calm body in the die-grotesk font (kept from v37), and a big Abbotsford Convent-style dark footer with a statement, newsletter signup, full sitemap, follow, and legal links."},
  {v:"37",   tag:"WAM Studio style",      date:"2026-07-11", site:true, home:"v37-wam/index.html",        desc:"wam.studio style: clean white ground with the real die-grotesk typeface (large regular-weight display), and their muted-vibrant colour-block palette (cyan, yellow, rose, orange, green, maroon) used as graphic panels instead of photos — the six blocks become six colour panels, plus a colour-bar band and a full-bleed maroon statement. Less image-based, more type-and-colour."},
  {v:"36",   tag:"AngelList 2023 style",  date:"2026-07-11", site:true, home:"v36-scrollcolor/index.html", desc:"angellist.com/2023 'Year in Review' style: dark teal #001d21 base under a fine dot-grid, salmon #fb8569 accent, Space Mono part-labels ('PART [01]') and thin salmon rules, huge Space Grotesk display type, a bordered stat-grid of the six blocks. The background colour shifts as you scroll — teal → indigo → warm cream → plum → teal — and the text auto-inverts to stay readable."},
  {v:"35",   tag:"Carl Hauser style",     date:"2026-07-11", site:true,  home:"v35-carlhauser/index.html", desc:"carlhauser.com 'theprocess' style: light-grey #e6e6e6 canvas of rounded cards, Inter SemiBold with tight tracking, a header card with a plus-bulleted menu, social links and a live Lisbon clock, then a monochrome masonry of the six blocks as archive cards with date/ID metadata, plus manifesto and quote notes."},
  {v:"34",   tag:"Human Voiceover style", date:"2026-07-11", site:true,  home:"v34-humanvoice/index.html",  desc:"humanvoiceover.com style: clean near-white ground with soft #f8fafd panels and periwinkle (#b8cce7) tints, dark #25292e text, and enormous Switzer Medium display type. Opens with their signature counter loading intro ('Finding your perfect block…' 0→100), a sticky glass nav, a giant-type six-block list, three soft method cards, a full-bleed dark statement and an oversized CTA."},
  {v:"33",   tag:"Creative Boom style",   date:"2026-07-11", site:true,  home:"v33-creativeboom/index.html", desc:"Creative Boom / The Studio community style: friendly editorial layout, warm cream hero band, Hanken Grotesk (standing in for ABC Diatype), bold flat character illustrations and photos borrowed from Creative Boom as placeholders, a playful green/yellow/orange/pink/blue palette, pill buttons, thin-rule three-column feature grid, rounded six-block cards, a green statement band and yellow CTA."},
  {v:"32",   tag:"WE MAKE THINGS style",  date:"2026-07-11", site:true,  home:"v32-wmt/index.html",       desc:"wemakethings.de style: pure black-on-white, hard 1px black hairlines dividing every section into a Swiss modular grid, uppercase neo-grotesque type (Geist, standing in for the proprietary Maison Neue), a numbered 01–06 block-list that inverts to black on hover, a scrolling marquee band, and a bordered four-column contact grid."},
  {v:"19",   tag:"CTRL muted style",  date:"2026-06-15", site:true,  home:"v19-ctrl/index.html",      desc:"A copy of v17 restyled to ctrl.xyz: an off-white canvas, Schibsted Grotesk medium-weight type in normal case, a muted palette with colour used only as small accents, 2px-outlined rounded cards and pills, a clean top nav, and a big FAQ accordion at the bottom."},

  {v:"30",   tag:"Corners style",        date:"2026-06-15", site:true,  home:"v30-corners/index.html",    desc:"Corners New York style: minimal Helvetica on white, classic hyperlink-blue (#0000ee) underlined links and orange (#fe531d) accents, a simple text-link menu, an art-store catalogue grid for the six blocks, and a Visit-style info list. Stills placeholder photos."},

function save(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
let favs=load(KEY_F), arch=load(KEY_A);
const fmt=d=>{const[y,m,da]=d.split('-').map(Number);return new Date(y,m-1,da).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});};

function card(x,archived){
  const enc=encodeURI(x.home), fav=favs.includes(x.v);
  return `<div class="card${fav?' is-fav':''}" data-v="${x.v}">
    <div class="thumb">
      <span class="vtag">v${x.v}</span>
      <span class="favflag">${HEART}</span>
      <div class="ph">${x.tag}</div>
      <iframe loading="lazy" scrolling="no" src="${enc}" title="${x.tag} preview"></iframe>
      <a class="full" href="${enc}" title="Open ${x.tag}"></a>
    </div>
    <div class="meta">
      <h3 title="Version ${x.v} — ${x.tag}">Version ${x.v} — ${x.tag}</h3>
      <div class="actions">
        <span class="date">${fmt(x.date)}</span>
        <button class="iconbtn fav${fav?' on':''}" data-act="fav" title="${fav?'Unfavorite':'Add to favorites'}">${HEART}</button>
        <button class="iconbtn arch" data-act="${archived?'restore':'arch'}" title="${archived?'Restore from archive':'Archive (hide)'}">${archived?RESTORE:ARCH}</button>
      </div>
    </div>
  </div>`;
}

function render(){
  const active=VERSIONS.filter(x=>!arch.includes(x.v));
  active.sort((a,b)=>(favs.includes(b.v)?1:0)-(favs.includes(a.v)?1:0));
  const archived=VERSIONS.filter(x=>arch.includes(x.v));
  grid.innerHTML=active.map(x=>card(x,false)).join('');
  archGrid.innerHTML=archived.map(x=>card(x,true)).join('');
  archsec.style.display=archived.length?'block':'none';
  document.getElementById('count').textContent=active.length+' shown'+(favs.length?' · '+favs.length+' favorite'+(favs.length>1?'s':''):'')+(archived.length?' · '+archived.length+' archived':'');
  document.querySelector('#archHead h2').textContent='Archived ('+archived.length+')';
  sizeThumbs();
}

function onClick(e){
  const btn=e.target.closest('.iconbtn'); if(!btn) return;
  e.preventDefault();
  const v=btn.closest('.card').dataset.v, act=btn.dataset.act;
  if(act==='fav'){ favs=favs.includes(v)?favs.filter(x=>x!==v):[...favs,v]; save(KEY_F,favs); }
  else if(act==='arch'){ if(!arch.includes(v))arch=[...arch,v]; save(KEY_A,arch); }
  else if(act==='restore'){ arch=arch.filter(x=>x!==v); save(KEY_A,arch); }
  render();
}
grid.addEventListener('click',onClick);
archGrid.addEventListener('click',onClick);
document.getElementById('archHead').addEventListener('click',()=>{archsec.classList.toggle('collapsed');requestAnimationFrame(sizeThumbs);setTimeout(sizeThumbs,80);});

function sizeThumbs(){
  document.querySelectorAll('.thumb').forEach(t=>{
    const f=t.querySelector('iframe'); if(f && t.clientWidth>0) f.style.transform='scale('+(t.clientWidth/1280)+')';
  });
}
window.addEventListener('resize',sizeThumbs);
window.addEventListener('load',sizeThumbs);

document.getElementById('foot').innerHTML="Previews render live from each version's home page. Favorites and archived state are remembered in this browser. Archiving hides a version here without deleting anything — ask me to physically move a folder into <b>archive/</b> if you want to declutter the files on disk.";
render();
</script>
</body>
</html>
