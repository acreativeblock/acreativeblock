<!doctype html><html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Block domain — A Creative Block</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="site.css?v=10"></head><body><canvas class="grain"></canvas><div class="site"><div data-site-header></div><main><section class="page-hero"><div class="wrap"><div class="eyebrow">One part of the map</div><h1 class="display" id="title">Starting &amp; Doing</h1><p id="intro"></p></div></section><section class="section"><div class="wrap content-grid"><div class="side-note">What it can look like</div><div class="prose"><h2 id="heading"></h2><p id="body"></p><div class="callout coral"><strong>A useful question</strong><p id="question" style="margin-top:10.8px"></p></div><p>No domain automatically tells us what to do. We clarify what is happening, check capacity and context, then test a response that fits.</p><a class="btn" style="margin-top:25.2px" href="method.html">See how we work</a></div></div></section></main><div data-site-footer></div></div><script src="site.js?v=10"></script><script src="../_logo/logo-anim.js?v=10"></script><script>var D={execution:['Starting & Doing','You want to move, but intention is not becoming action.','Knowing is not the same as moving.','This may show up as avoiding the first step, losing traction, repeatedly restarting or not knowing what the next concrete action is. The useful task is to find the friction—not demand more willpower.','What becomes possible if the next step is made smaller, clearer or safer?'],identity:['Confidence & Exposure','The work feels entangled with who you are and how others may see you.','When making becomes self-exposure.','Impostor feelings, perfectionism, uncertainty about your voice or fear of judgement can make every decision feel like evidence about your worth.','What is the work asking you to risk—and what would make that risk tolerable?'],direction:['Direction & Meaning','There are options, but no direction has enough pull.','A project needs a reason as well as a route.','Too many ideas, conflicting aims, uncertain strengths or a loss of meaning can produce movement without progress—or stop movement altogether.','What would make this project worth choosing now?'],depletion:['Energy & Recovery','The work asks for resources you do not currently have.','Capacity is part of the creative system.','Exhaustion, stress or sustained cognitive load can look like avoidance. The response may be recovery, reduced demand or a different pace—not another productivity technique.','What does the work need from you, and is that resource genuinely available?'],process:['The Work Itself','The idea, brief, material or process is not yielding.','Sometimes the problem is in the project.','The premise may be weak, the constraints unhelpful, the feedback vague or the exploration too narrow. Direct creative consulting can be more useful than turning everything inward.','What assumption about the work has not yet been tested?'],systems:['Structure & Workflow','The project is too large, chaotic or poorly sequenced.','Good work needs a structure it can live inside.','Unclear decisions, competing priorities, bloated scope or an unreliable workflow can create repeated friction even when motivation is intact.','Which part of the system keeps recreating the same block?'],context:['Context & Support','The world around the work is working against it.','Creativity never happens in a vacuum.','Time, distractions, physical setup, relationships, feedback culture, isolation or missing support can make a workable project feel impossible.','What needs to change around the work—not inside you?']};var k=new URLSearchParams(location.search).get('type')||'execution',d=D[k]||D.execution;document.title=d[0]+' — A Creative Block';title.textContent=d[0];intro.textContent=d[1];heading.textContent=d[2];body.textContent=d[3];question.textContent=d[4];</script></body></html>
