<script>(function(){
  var wrap=document.querySelector('.contact-form-wrap'),form=document.querySelector('.cform');
  function showSent(){if(wrap)wrap.innerHTML='<span class="side-note">Message sent</span><h2 style="margin:.2em 0 .45em">Thanks — your message is on its way.</h2><p class="note">We’ll get back to you as soon as we can.</p>';}
  if(/[?&]sent=1/.test(location.search)){showSent();return}
  if(!form)return;
  var status=form.querySelector('.cform-status'),btn=form.querySelector('button[type=submit]'),btnLabel=btn.textContent;
  form.addEventListener('submit',function(e){
    e.preventDefault();
    btn.disabled=true;btn.textContent='Sending…';
    if(status){status.textContent='';status.className='cform-status'}
    fetch(form.action,{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(Object.fromEntries(new FormData(form)))
    }).then(function(r){return r.json().then(function(data){return{ok:r.ok,data:data}})}).then(function(res){
      if(res.ok&&res.data&&res.data.success===true){showSent()}
      else{throw new Error('web3forms error')}
    }).catch(function(){
      btn.disabled=false;btn.textContent=btnLabel;
      if(status){status.className='cform-status is-error';status.textContent='Something went wrong sending that — please try again, or email hello@acreativeblock.com directly.'}
    });
  });
})();</script>
