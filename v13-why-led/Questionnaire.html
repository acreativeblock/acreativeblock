<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find your block — A Creative Block</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233b39e0'/%3E%3Cpath d='M16 5 L19 13 L27 16 L19 19 L16 27 L13 19 L5 16 L13 13 Z' fill='%23e7f6a0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="s.css">
<style>
.qprog{position:fixed;top:0;left:0;height:5px;background:var(--red);width:0;transition:width .3s ease;z-index:300}
.qtop{position:fixed;top:0;left:0;right:0;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,40px);z-index:200}
.qtop .logo{font-weight:900;font-size:20px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;color:var(--ink)}
.qtop .logo .flower{color:var(--red);font-size:18px}
.qtop .count{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.5px}
.qstage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:96px 22px 64px}
.qcard{width:100%;max-width:720px}
.qnum{font-size:12px;color:var(--red);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.qnum .flower{font-size:16px;line-height:0}
.qtext{font-weight:900;font-size:clamp(26px,4.4vw,52px);line-height:.98;letter-spacing:-.035em;margin-bottom:10px}
.qhelp{color:var(--muted);font-size:15px;margin-bottom:30px;font-weight:500}
.qopts{display:flex;flex-direction:column;gap:10px;max-width:620px}
.qopt{display:flex;align-items:center;gap:14px;border:2px solid rgba(23,22,21,.14);background:var(--paper);border-radius:18px;padding:16px 18px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.qopt:hover{border-color:var(--ink);transform:translateX(3px)}
.qopt.sel{border-color:var(--blue);background:#eceaff}
.qopt .key{width:28px;height:28px;border:2px solid rgba(23,22,21,.16);border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
.qopt.sel .key{background:var(--blue);color:#fff;border-color:var(--blue)}
.qscale{display:flex;gap:10px;flex-wrap:wrap}
.qs{width:62px;height:62px;border:2px solid rgba(23,22,21,.14);background:var(--paper);border-radius:16px;font-size:21px;font-weight:800;cursor:pointer;transition:transform .12s,border-color .12s,background .12s;font-family:inherit;color:inherit}
.qs:hover{border-color:var(--ink);transform:translateY(-3px)}
.qs.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.qscalelab{display:flex;justify-content:space-between;max-width:468px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600}
.qtxt{width:100%;max-width:580px;border:none;border-bottom:3px solid rgba(23,22,21,.16);background:transparent;font-family:inherit;font-size:24px;font-weight:700;padding:10px 2px;color:var(--ink);resize:none}
.qtxt:focus{outline:none;border-bottom-color:var(--blue)}
.qtxt::placeholder{color:#b6b0a4}
.qrow{display:flex;align-items:center;gap:14px;margin-top:34px;flex-wrap:wrap}
.qbtn{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:14px 28px;border-radius:50px;font-size:15.5px;font-weight:800;border:none;cursor:pointer;font-family:inherit;transition:transform .15s}
.qbtn:hover{transform:translateY(-2px) rotate(-1deg)}
.qbtn.red{background:var(--red)}
.qghost{background:transparent;color:var(--muted);padding:14px 6px;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px}
.qhint{font-size:13px;color:var(--muted);font-weight:600}.qhint b{color:var(--ink)}
.qcenter{text-align:center;max-width:700px;margin:0 auto}
.qcenter .big{font-weight:900;font-size:clamp(40px,8vw,96px);line-height:.86;letter-spacing:-.04em;margin:18px 0}
.qcenter .big .bl{color:var(--blue)}
.qcenter p{font-size:18px;color:#3a372f;margin-bottom:26px;font-weight:500;line-height:1.5}
.bigstar{width:46px;height:46px;display:block;margin:0 auto}
.qrescard{background:var(--paper);border-radius:28px;padding:clamp(26px,4vw,40px);text-align:left;margin:8px 0 22px;border-top:10px solid var(--blue);box-shadow:var(--shadow)}
.qrescard .rlabel{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:800}
.qrescard h3{font-weight:900;font-size:clamp(34px,5.5vw,58px);letter-spacing:-.04em;line-height:.92;margin:6px 0 12px}
.qrescard .rline{font-size:18px;font-weight:700;margin-bottom:18px;letter-spacing:-.01em}
.qrescard .rk{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:14px}
.qrescard .rk+p{font-size:15.5px;color:#3a372f;font-weight:500;line-height:1.5}
.qressec{font-size:15.5px;color:#3a372f;margin-bottom:22px;font-weight:500}.qressec b{color:var(--ink);font-weight:800}
.qemail{display:flex;gap:10px;max-width:540px;margin:0 auto;flex-wrap:wrap;justify-content:center}
.qemail input{flex:1;min-width:240px;border:2px solid rgba(23,22,21,.16);border-radius:50px;padding:14px 22px;font-size:15px;font-family:inherit;background:var(--paper);font-weight:600}
.qemail input:focus{outline:none;border-color:var(--blue)}
.qbars{max-width:540px;margin:24px auto 0;text-align:left}
.qbar{display:flex;align-items:center;gap:12px;margin:8px 0;font-size:13px}
.qbar .bn{width:128px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;font-size:11px}
.qbar.is-primary .bn{color:var(--ink);font-weight:900}
.qbar .bt{flex:1;height:11px;background:rgba(23,22,21,.1);border-radius:6px;overflow:hidden}
.qbar .bf{display:block;height:100%;border-radius:6px;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.qbar .bv{width:30px;text-align:right;font-weight:800;font-size:13px;color:var(--ink)}
</style>
</head>
<body>
<div class="qprog" id="progress"></div>
<div class="qtop">
  <a href="index.html" class="logo"><span class="flower"><svg viewBox="0 0 100 100"><g fill="currentColor"><ellipse cx="50" cy="27" rx="13" ry="23"/><ellipse cx="50" cy="27" rx="13" ry="23" transform="rotate(60 50 50)"/><ellipse cx="50" cy="27" rx="13" ry="23" transform="rotate(120 50 50)"/><ellipse cx="50" cy="27" rx="13" ry="23" transform="rotate(180 50 50)"/><ellipse cx="50" cy="27" rx="13" ry="23" transform="rotate(240 50 50)"/><ellipse cx="50" cy="27" rx="13" ry="23" transform="rotate(300 50 50)"/></g><path d="M50 40 l3.2 7.8 7.8 3.2 -7.8 3.2 -3.2 7.8 -3.2 -7.8 -7.8 -3.2 7.8 -3.2 Z" fill="rgba(0,0,0,.22)"/></svg></span>A Creative Block</a>
  <div class="count" id="count"></div>
</div>
<div class="qstage"><div id="screen" class="qcard"></div></div>

<script>
const BLOCKS = {
  DIR:{name:"Directional",color:"#3b39e0",line:"You're not short on motivation — you're short on direction.",
       mech:"Commitment anxiety: choosing one path means closing others, so you commit to none. Common in multi-potential creatives and ADHD minds.",
       help:"Constraints, and a temporary, actionable direction — enough to create movement. It doesn't have to be permanent, only doable."},
  STR:{name:"Structural",color:"#fa4616",line:"The project is too chaotic to move — even with vision and drive.",
       mech:"Your brain can't process undefined complexity: scope too large, no hierarchy, unclear sequencing, too many moving parts.",
       help:"Restructure the work — scope, stages, priorities and dependencies — until the next step is obvious."},
  EXE:{name:"Execution",color:"#1e7d3a",line:"You know what to do — you just avoid doing it. This is not laziness.",
       mech:"Your nervous system tags the task as threatening, painful or identity-relevant, so it protects you by avoiding it.",
       help:"Shrink the task, remove ambiguity, lower the emotional stakes, and add external accountability."},
  IDE:{name:"Identity",color:"#cf3fa0",line:"Finishing threatens your sense of worth, so you stall near the end.",
       mech:"Creative work has become a verdict on who you are — succeed and expectations rise, fail and identity takes the hit.",
       help:"Separate self-worth from output, normalise imperfect release, and reduce catastrophic thinking. (Coaching territory — with boundaries.)"},
  SKI:{name:"Skill",color:"#d99e10",line:"You're genuinely missing a skill the project needs — often misread as emotional.",
       mech:"The project exceeds your current ability, which breeds shame, avoidance and impostor feelings.",
       help:"Name the exact missing skill and the smallest path to learning it. Clarity alone often removes the anxiety."},
  ENV:{name:"Environmental",color:"#9d5ce6",line:"Your context is killing momentum — the problem is outside, not inside.",
       mech:"Your environment is incompatible with sustained creative work: burnout, money stress, no space, chaos, constant interruptions.",
       help:"Redesign the conditions — sleep, schedule, boundaries, workload, space — before blaming your discipline."}
};

const Q = [
  {type:'intro'},
  {basic:'age', type:'choice', q:"First, the basics. Which age group are you in?", opts:["Under 18","18–24","25–34","35–44","45–54","55+"]},
  {basic:'field', type:'text', q:"What's your main creative project or field?", ph:"e.g. design, music, writing, a book, a side project…"},
  {basic:'freq', type:'choice', q:"How often do you feel creatively blocked?", opts:["Rarely","A few times a year","Monthly","Weekly","Almost daily"]},
  {block:'DIR', type:'scale', q:"I have too many ideas and can't decide which to commit to."},
  {block:'STR', type:'scale', q:"My projects feel too big or chaotic to manage."},
  {block:'EXE', type:'scale', q:"I know exactly what to do, but I avoid actually doing it."},
  {block:'IDE', type:'scale', q:"I'm afraid my work — or I — won't be good enough."},
  {block:'SKI', type:'scale', q:"I get stuck because I don't technically know how to do the next part."},
  {block:'ENV', type:'scale', q:"My schedule, space or finances make consistent work hard."},
  {type:'choice6', q:"When you stall, which is closest to the truth?",
   opts:[{t:"I don't know which direction to commit to.",b:'DIR'},{t:"The project is a chaotic mess.",b:'STR'},{t:"I know the steps — I just can't start.",b:'EXE'},{t:"I'm scared it (or I) won't be good enough.",b:'IDE'},{t:"I don't know how to do the next part.",b:'SKI'},{t:"My life or context makes it impossible.",b:'ENV'}]},
  {block:'DIR', type:'scale', q:"I keep starting new projects instead of finishing the one I'm on."},
  {block:'STR', type:'scale', q:"I keep re-planning and reorganising instead of progressing."},
  {block:'EXE', type:'scale', q:"I procrastinate or get distracted right when it's time to work."},
  {block:'IDE', type:'scale', q:"I often abandon projects when they're almost finished."},
  {block:'SKI', type:'scale', q:"I consume tutorials and courses but still can't execute."},
  {block:'ENV', type:'scale', q:"I feel exhausted or burned out more than uninspired."},
  {block:'DIR', type:'scale', q:"I spend more time exploring options than actually making."},
  {block:'STR', type:'scale', q:"Everything feels equally urgent — I can't tell what to do first."},
  {block:'EXE', type:'scale', q:"I keep ‘preparing’ endlessly instead of starting."},
  {block:'IDE', type:'scale', q:"Sharing or publishing my work makes me anxious."},
  {block:'SKI', type:'scale', q:"The project needs a skill I haven't learned yet."},
  {block:'ENV', type:'scale', q:"Constant interruptions or instability keep breaking my focus."},
  {type:'choice6', q:"What would help you most right now?",
   opts:[{t:"A clear direction to commit to.",b:'DIR'},{t:"A way to structure the chaos.",b:'STR'},{t:"A push to actually begin.",b:'EXE'},{t:"Permission to make something imperfect.",b:'IDE'},{t:"Learning a specific skill.",b:'SKI'},{t:"Fixing my time, space or energy.",b:'ENV'}]},
  {type:'result'}
];

const answers={}; let i=0;
const screen=document.getElementById('screen'), progress=document.getElementById('progress'), count=document.getElementById('count');
const KEYS="ABCDEF";
const total=Q.filter(q=>q.q).length;
function qIndex(){ let n=0; for(let k=1;k<=i;k++){ if(Q[k]&&Q[k].q) n++; } return n; }
const starSVG=c=>`<svg class="bigstar" viewBox="0 0 40 40"><path d="M20 1 L25 15 L39 20 L25 25 L20 39 L15 25 L1 20 L15 15 Z" fill="${c}"/></svg>`;
const flowerSVG=`<span class="flower" style="color:var(--red)"><svg viewBox="0 0 100 100"><g fill="currentColor"><ellipse cx="50" cy="27" rx="13" ry="23"/><ellipse cx="50" cy="27" rx="13" ry="23" transform="rotate(60 50 50)"/><ellipse cx="50" cy="27" rx="13" ry="23" transform="rotate(120 50 50)"/><ellipse cx="50" cy="27" rx="13" ry="23" transform="rotate(180 50 50)"/><ellipse cx="50" cy="27" rx="13" ry="23" transform="rotate(240 50 50)"/><ellipse cx="50" cy="27" rx="13" ry="23" transform="rotate(300 50 50)"/></g></svg></span>`;

function score(){
  const s={DIR:0,STR:0,EXE:0,IDE:0,SKI:0,ENV:0};
  Q.forEach((q,idx)=>{
    const a=answers[idx]; if(a==null) return;
    if(q.block && q.type==='scale') s[q.block]+=Number(a);
    if(q.type==='choice6') s[a]+=4;
  });
  return s;
}

function render(){
  const item=Q[i];
  progress.style.width=(i/(Q.length-1)*100)+'%';
  count.textContent=item.q?(qIndex()+' / '+total):'';

  if(item.type==='intro'){
    screen.innerHTML=`<div class="qcenter">${starSVG('#f7c52d')}
      <div class="big">Find your <span class="bl">block</span></div>
      <p>Creative block isn't one thing — it's six. Answer ~20 quick questions and we'll identify the one most likely stopping you, with what actually helps. Takes about 4 minutes, and you can send the result to a coach at the end.</p>
      <button class="qbtn red" onclick="next()">Start →</button></div>`;
    return;
  }

  if(item.type==='result'){
    const s=score();
    const order=Object.keys(s).sort((a,b)=>s[b]-s[a]);
    const p=order[0], sec=order[1];
    const P=BLOCKS[p], S=BLOCKS[sec];
    const max=Math.max(...Object.values(s))||1;
    const bars=order.map(k=>`<div class="qbar${k===p?' is-primary':''}"><span class="bn">${BLOCKS[k].name}</span><span class="bt"><span class="bf" data-w="${Math.round(s[k]/max*100)}" style="background:${BLOCKS[k].color}"></span></span><span class="bv">${s[k]}</span></div>`).join('');
    screen.innerHTML=`<div class="qcenter" style="max-width:720px">
      ${starSVG(P.color)}
      <p style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:14px 0 0">Your result</p>
      <div class="qrescard" style="border-top-color:${P.color}">
        <div class="rlabel">Primary block</div>
        <h3>${P.name}</h3>
        <div class="rline">${P.line}</div>
        <div class="rk">Why it happens</div><p>${P.mech}</p>
        <div class="rk">What helps</div><p>${P.help}</p>
      </div>
      <p class="qressec"><b>Secondary pattern:</b> ${S.name}. Most people are mixtures — the work is to address the <b>primary driver</b> first.</p>
      <div class="qbars">${bars}</div>
      <p style="margin:26px 0 12px;font-size:16px;color:#3a372f;font-weight:500">Want a coach to look at this with you? Drop your email and we'll send your result.</p>
      <div class="qemail">
        <input type="email" id="rmail" placeholder="Your email">
        <button class="qbtn red" onclick="sendResults('${p}','${sec}')">Send my result →</button>
      </div>
      <p style="margin-top:24px"><a href="index.html" style="color:var(--muted);text-decoration:underline;font-weight:600">Back to site</a></p>
    </div>`;
    requestAnimationFrame(()=>screen.querySelectorAll('.bf').forEach(f=>{f.style.width=f.dataset.w+'%';}));
    return;
  }

  const sec=`<div class="qnum">${flowerSVG} ${item.basic?'About you':'Your block'}</div>`;
  let body=''; const cur=answers[i];
  if(item.type==='choice'){
    body=`<div class="qopts">`+item.opts.map((o,idx)=>`<div class="qopt ${cur===o?'sel':''}" data-o="${o.replace(/"/g,'&quot;')}"><span class="key">${KEYS[idx]}</span><span>${o}</span></div>`).join('')+`</div>`;
  } else if(item.type==='choice6'){
    body=`<div class="qopts">`+item.opts.map((o,idx)=>`<div class="qopt ${cur===o.b?'sel':''}" data-b="${o.b}"><span class="key">${KEYS[idx]}</span><span>${o.t}</span></div>`).join('')+`</div>`;
  } else if(item.type==='scale'){
    body=`<div class="qscale">`+[1,2,3,4,5].map(n=>`<button class="qs ${cur==n?'sel':''}" data-s="${n}">${n}</button>`).join('')+`</div><div class="qscalelab"><span>1 — not me</span><span>5 — totally me</span></div>`;
  } else if(item.type==='text'){
    body=`<textarea rows="2" class="qtxt" id="ta" placeholder="${item.ph||'Type here…'}">${cur||''}</textarea>`;
  }
  const backBtn=i>1?`<button class="qghost" onclick="prev()">← Back</button>`:'';
  const isText=item.type==='text';
  screen.innerHTML=`${sec}<div class="qtext">${item.q}</div>${item.help?`<div class="qhelp">${item.help}</div>`:''}${body}
    <div class="qrow"><button class="qbtn" onclick="next()">${i===Q.length-2?'See result':'Next'} →</button>${backBtn}${isText?'<span class="qhint">press <b>Enter</b> to continue</span>':''}</div>`;

  if(item.type==='choice'){ screen.querySelectorAll('.qopt').forEach(el=>el.onclick=()=>{answers[i]=el.dataset.o;setTimeout(next,150);}); }
  if(item.type==='choice6'){ screen.querySelectorAll('.qopt').forEach(el=>el.onclick=()=>{answers[i]=el.dataset.b;setTimeout(next,150);}); }
  if(item.type==='scale'){ screen.querySelectorAll('.qs').forEach(el=>el.onclick=()=>{answers[i]=el.dataset.s;setTimeout(next,150);}); }
  if(isText){ const ta=document.getElementById('ta'); ta.focus(); ta.oninput=()=>answers[i]=ta.value; }
}
function next(){ if(i<Q.length-1){i++;render();window.scrollTo(0,0);} }
function prev(){ if(i>0){i--;render();window.scrollTo(0,0);} }
window.next=next; window.prev=prev;

function sendResults(p,sec){
  const s=score();
  const email=(document.getElementById('rmail')||{}).value||'(not provided)';
  const basics=`Age: ${answers[1]||'-'}\nField: ${answers[2]||'-'}\nFrequency: ${answers[3]||'-'}`;
  const scoreLines=Object.keys(BLOCKS).map(k=>`${BLOCKS[k].name}: ${s[k]}`).join('\n');
  const body=`Block-type quiz result\n\nPrimary block: ${BLOCKS[p].name}\nSecondary: ${BLOCKS[sec].name}\n\nScores:\n${scoreLines}\n\n${basics}\n\nContact: ${email}`;
  window.location.href=`mailto:hello@acreativeblock.com?subject=${encodeURIComponent('Block quiz result — '+BLOCKS[p].name)}&body=${encodeURIComponent(body)}`;
}
window.sendResults=sendResults;

document.addEventListener('keydown',e=>{
  const item=Q[i];
  if(e.key==='Enter'){ e.preventDefault(); next(); }
  if(item&&(item.type==='choice'||item.type==='choice6')&&/^[a-f]$/i.test(e.key)){
    const idx=KEYS.indexOf(e.key.toUpperCase());
    if(idx>-1&&item.opts[idx]){ answers[i]=item.type==='choice6'?item.opts[idx].b:item.opts[idx]; setTimeout(next,120);} }
  if(item&&item.type==='scale'&&/^[1-5]$/.test(e.key)){ answers[i]=e.key; setTimeout(next,120); }
});
render();
</script>
</body>
</html>
