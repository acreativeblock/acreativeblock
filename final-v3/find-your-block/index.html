<!doctype html><html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find your block type — A Creative Block</title><link rel="icon" href="../favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--blue:#0b70d8;--orange:#FF7F50;--ink:#1E1E1E;--white:#fff;--yellow:#f4dc55;--mint:#bde7d5}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--blue);font-family:Inter,-apple-system,sans-serif;font-weight:400}.progress{position:fixed;z-index:5;inset:0 auto auto 0;height:4px;background:var(--orange);transition:width .3s}.top{height:82px;padding:18px clamp(22px,4vw,58px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--blue)}.top img{width:105px;height:48px;object-fit:contain}.count{font-size:11px;text-transform:uppercase;letter-spacing:.05em}.stage{min-height:calc(100vh - 82px);display:grid;place-items:center;padding:55px 22px}.card{width:min(760px,100%)}h1,.qtext,.res h2{text-transform:uppercase;font-weight:400;letter-spacing:-.045em;line-height:1}.intro h1{font-size:clamp(42px,7vw,84px);margin:0}.intro p{font-size:16px;line-height:1.55;max-width:56ch;margin:25px 0}.qmeta{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);margin-bottom:16px}.qtext{font-size:clamp(27px,4.5vw,48px);margin-bottom:28px}.opts{display:grid;gap:10px}.opt,.scale button{font:inherit;color:var(--blue);background:#fff;border:1px solid var(--blue);padding:16px 18px;text-align:left;cursor:pointer;transition:.2s}.opt:hover,.opt.sel,.scale button:hover,.scale button.sel{background:var(--blue);color:#fff}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.scale button{text-align:center;font-size:20px}.labels{display:flex;justify-content:space-between;font-size:11px;margin-top:8px}.nav{display:flex;gap:12px;margin-top:30px}.btn{font:inherit;border:1px solid var(--blue);border-radius:999px;padding:12px 22px;background:var(--blue);color:#fff;cursor:pointer}.btn.alt{background:transparent;color:var(--blue)}.res h2{font-size:clamp(38px,6vw,68px);margin:6px 0 14px}.state{background:var(--orange);color:#fff;padding:22px;margin:22px 0}.state strong{font-size:23px;font-weight:400;text-transform:uppercase}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.result-card{border:1px solid var(--blue);padding:25px}.result-card h3{text-transform:uppercase;font-weight:400;font-size:24px;margin:6px 0 15px}.result-card p{font-size:13px;line-height:1.55}.bars{margin:25px 0}.bar{display:grid;grid-template-columns:155px 1fr 30px;gap:10px;align-items:center;margin:8px 0;font-size:11px;text-transform:uppercase}.track{height:8px;background:#dedcf8}.fill{height:100%;background:var(--blue)}.note{font-size:12px;line-height:1.5;opacity:.75;margin-top:20px}@media(max-width:620px){.result-grid{grid-template-columns:1fr}.scale{gap:5px}.bar{grid-template-columns:110px 1fr 25px}}
</style></head><body><div class="progress" id="progress"></div><header class="top"><a href="../"><span class="quiz-logo" data-clean-beta-logo data-acb-logo="3lines" data-acb-mode="none"></span></a><span class="count" id="count"></span></header><main class="stage"><div class="card" id="screen"></div></main><script>
const D={EXE:{n:'Starting & Doing',d:'Intention is not becoming action: starting, continuing, finishing or showing keeps breaking down.',h:'Reduce threat and ambiguity, make the next approach behaviour concrete, and test what interrupts action.'},IDE:{n:'Confidence & Exposure',d:'The work feels entangled with worth, voice, confidence or how other people may see you.',h:'Separate person from artefact, create safer exposure, and rebuild accurate confidence.'},DIR:{n:'Direction & Meaning',d:'There are options, but no direction has enough pull—or the project has lost its reason.',h:'Clarify what matters now, choose a temporary direction and define what would make it worth pursuing.'},DEP:{n:'Energy & Recovery',d:'The work asks for energy, attention or recovery capacity that is not currently available.',h:'Address load and recovery first, then use a gradual and sustainable re-entry.'},PRO:{n:'The Work Itself',d:'The idea, brief, material or creative problem itself is not yielding.',h:'Reframe the problem, change constraints, generate alternatives or use direct creative consulting.'},SYS:{n:'Structure & Workflow',d:'Scope, sequencing, decisions or tools repeatedly recreate friction.',h:'Redesign the system so priorities, ownership and the next action are visible.'},CTX:{n:'Context & Support',d:'Time, space, feedback, relationships or working conditions are fighting the work.',h:'Change what surrounds the work: boundaries, setup, feedback culture, support or resources.'}};
const Q=[{intro:1},{b:'EXE',q:'I keep avoiding, delaying or repeatedly restarting the work.'},{b:'IDE',q:'The work feels like a judgement of my ability, identity or worth.'},{b:'DIR',q:'I cannot choose a direction—or no option feels meaningful enough.'},{b:'DEP',q:'I know what matters, but I do not have the energy or capacity for it.'},{b:'PRO',q:'I keep attacking the creative problem in the same way without finding a workable answer.'},{b:'SYS',q:'The project is too large, chaotic or poorly sequenced to move through.'},{b:'CTX',q:'My time, space, feedback or support makes sustained work difficult.'},{choice:1,q:'Which description is closest right now?',o:[['I cannot get myself to begin, continue, finish or show it.','EXE'],['I feel exposed, fraudulent or unsure of my voice.','IDE'],['I do not know what to choose or why this project matters.','DIR'],['I am drained, flat or carrying too much.','DEP'],['The idea, brief or creative approach is not working.','PRO'],['The workflow, scope or decisions are a mess.','SYS'],['The conditions around me keep breaking momentum.','CTX']]},{skill:1,q:'Is there a specific capability you genuinely need but do not yet have?'},{state:1,q:'When you approach the work, what does your system feel like?',o:[['Flooded—tense, anxious, restless or desperate to escape.','FLOODED'],['Empty—flat, heavy, disengaged or without fuel.','EMPTY'],['Regulated—alert enough to engage without feeling overwhelmed.','REGULATED']]},{stateScale:1,q:'How activated do you feel around this project right now?'},{result:1}];
let i=0,A={},screen=document.querySelector('#screen'),count=document.querySelector('#count'),progress=document.querySelector('#progress');const scored=Q.filter(x=>x.q).length;function qi(){return Q.slice(0,i+1).filter(x=>x.q).length}function swap(step){screen.classList.add("step-fade");setTimeout(function(){step();render();requestAnimationFrame(function(){screen.classList.remove("step-fade")})},220)}function next(){if(i<Q.length-1)swap(function(){i++})}function back(){if(i>0)swap(function(){i--})}function choose(v){A[i]=v;setTimeout(next,100)}function scores(){let s={EXE:0,IDE:0,DIR:0,DEP:0,PRO:0,SYS:0,CTX:0};Q.forEach((q,j)=>{if(q.b&&A[j])s[q.b]+=+A[j];if(q.choice&&A[j])s[A[j]]+=4});return s}function activation(){let c=A[10],n=+A[11]||3;if(c==='FLOODED'||n>=4)return['Flooded','Your system appears highly activated. Regulate first; forcing intensity can make the block more rigid.'];if(c==='EMPTY'||n<=2)return['Empty','Your system appears under-activated. Capacity, recovery, interest or gentle activation may need attention before pressure.'];return['Regulated','Your activation looks workable enough for enquiry, experimentation and a proportionate next step.']}
function render(){let q=Q[i];progress.style.width=(i/(Q.length-1)*100)+'%';count.textContent=q.q?qi()+' / '+scored:'';if(q.intro){screen.innerHTML='<div class="intro"><div class="qmeta">An evidence-informed reflection tool</div><h1>Find your block type</h1><p>Creative block is not one thing. This short tool looks across seven practical domains and the activation state around your work. It offers a hypothesis to explore—not a clinical diagnosis.</p><button class="btn" onclick="next()">Begin →</button></div>';return}if(q.result){let s=scores(),order=Object.keys(s).sort((a,b)=>s[b]-s[a]),p=order[0],sec=order[1],act=activation(),max=Math.max(...Object.values(s),1),skill=A[9];screen.innerHTML='<div class="res"><div class="qmeta">Your working hypothesis</div><h2>'+D[p].n+'</h2><div class="result-grid"><div class="result-card"><small>Primary domain</small><h3>'+D[p].n+'</h3><p>'+D[p].d+'</p><p><strong>Useful direction:</strong> '+D[p].h+'</p></div><div class="result-card"><small>Secondary domain</small><h3>'+D[sec].n+'</h3><p>'+D[sec].d+'</p></div></div><div class="state"><strong>'+act[0]+' state</strong><p>'+act[1]+'</p></div>'+(skill==='YES'?'<div class="result-card"><h3>Skill gap to test</h3><p>You reported a concrete missing capability. Treat that as a boundary question rather than automatically turning it into a psychological block: specify the skill, teach or learn it, then see what remains.</p></div>':'')+'<div class="bars">'+order.map(k=>'<div class="bar"><span>'+D[k].n+'</span><span class="track"><span class="fill" style="display:block;width:'+Math.round(s[k]/max*100)+'%"></span></span><b>'+s[k]+'</b></div>').join('')+'</div><p class="note">Domains overlap and change over time. Empty, Regulated and Flooded are state modifiers across every domain—not additional block types. This tool is not a validated diagnostic instrument.</p><div class="nav"><a class="btn" href="../the-block-map/">Explore the block map</a><button class="btn alt" onclick="i=0;A={};render()">Start again</button></div></div>';return}let body='';if(q.b||q.stateScale)body='<div class="scale">'+[1,2,3,4,5].map(n=>'<button class="'+(A[i]==n?'sel':'')+'" onclick="choose('+n+')">'+n+'</button>').join('')+'</div><div class="labels"><span>'+(q.stateScale?'Very low':'Not like me')+'</span><span>'+(q.stateScale?'Very high':'Very like me')+'</span></div>';else if(q.choice||q.state)body='<div class="opts">'+q.o.map(x=>'<button class="opt '+(A[i]===x[1]?'sel':'')+'" onclick="choose(\''+x[1]+'\')">'+x[0]+'</button>').join('')+'</div>';else if(q.skill)body='<div class="opts"><button class="opt" onclick="choose(\'YES\')">Yes—I can name a specific skill or technique</button><button class="opt" onclick="choose(\'NO\')">No—the difficulty seems to be elsewhere</button><button class="opt" onclick="choose(\'UNSURE\')">I am not sure yet</button></div>';screen.innerHTML='<div class="qmeta">'+(q.state||q.stateScale?'Activation state':q.skill?'Boundary check':'Block map')+'</div><div class="qtext">'+q.q+'</div>'+body+'<div class="nav">'+(i>1?'<button class="btn alt" onclick="back()">← Back</button>':'')+'</div>'}window.next=next;window.back=back;window.choose=choose;render();
</script><style>
body{background:var(--blue);color:#fff}.top{border-bottom-color:rgba(255,255,255,.5)}.top img{filter:brightness(0) invert(1)}.count,.qmeta{color:rgba(255,255,255,.7)}.card{max-width:700px}h1,.qtext,.res h2{text-transform:none;letter-spacing:-.035em;line-height:1.05}.intro h1{font-size:clamp(40px,6vw,70px)}.intro p,.note{color:rgba(255,255,255,.78)}.opt,.scale button,.result-card{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.65);border-radius:14px}.opt:hover,.opt.sel,.scale button:hover,.scale button.sel{background:#fff;color:var(--blue);border-color:#fff}.btn{background:#fff;color:var(--blue);border-color:#fff}.btn.alt{background:transparent;color:#fff;border-color:#fff}.labels{color:rgba(255,255,255,.68)}.state{border-radius:14px}.state strong,.result-card h3{text-transform:none}.track{background:rgba(255,255,255,.22)}.fill{background:#fff}.bar{color:#fff}#screen{transition:opacity .24s ease}#screen.step-fade{opacity:0}
</style><style>.quiz-logo{display:block;height:48px;color:#fff}.quiz-logo svg{display:block;height:100%;width:auto}.quiz-logo svg path,.quiz-logo svg circle{fill:currentColor!important}.quiz-logo svg rect[clip-path]{display:none!important}</style><script src="../_logo/logo-anim.js?v=10"></script><script>(function cleanLogo(){var mount=document.querySelector('[data-clean-beta-logo]'),svg=mount&&mount.querySelector('svg');if(!svg){requestAnimationFrame(cleanLogo);return}svg.querySelectorAll('rect[clip-path]').forEach(function(n){var m=(n.getAttribute('clip-path')||'').match(/#([^\)]+)/),cp=m&&svg.querySelector('#'+m[1]);n.remove();if(cp)cp.remove()});var pupil=svg.querySelector('circle'),eye=null;if(pupil){var x=+pupil.getAttribute('cx'),y=+pupil.getAttribute('cy');svg.querySelectorAll('path').forEach(function(p){var b=p.getBBox();if(x>=b.x&&x<=b.x+b.width&&y>=b.y&&y<=b.y+b.height&&(!eye||b.width*b.height<eye.a))eye={p:p,a:b.width*b.height}})}if(eye){eye.p.style.transformBox='fill-box';eye.p.style.transformOrigin='center';(function blink(){setTimeout(function(){eye.p.animate([{transform:'scaleY(1)'},{transform:'scaleY(.08)',offset:.48},{transform:'scaleY(1)'}],{duration:180,easing:'cubic-bezier(.4,0,.2,1)'});if(pupil)pupil.animate([{opacity:1},{opacity:0,offset:.4},{opacity:0,offset:.58},{opacity:1}],{duration:180});blink()},2200+Math.random()*3600)})()}})();</script>
